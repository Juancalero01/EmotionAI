services:
  # Cerebro asíncrono en FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emotion_backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./recordings:/app/recordings
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - emotion_network

  # Capa de memoria y Pub/Sub en tiempo real
  redis:
    image: redis:7-alpine
    container_name: emotion_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - emotion_network

volumes:
  redis_data:

networks:
  emotion_network:
    driver: bridge
